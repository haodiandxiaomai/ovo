name: Android14 Kernel Module Build

on:
  workflow_dispatch:

jobs:
  build:
    name: GKI Kernel Module Build
    runs-on: ubuntu-latest
    needs: upload-artifact
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只保留 android14-6.1，安全日期 2025-03，tag 必须为 android14-6.1 以通过验证
          - version: 6.1.128
            tag: android14-6.1          # 用于 simple-tag 验证
            patch-level: 2025-03         # 会拼接成 tag+patch-level，即 android14-6.1-2025-03
            arch: aarch64

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run GKI Kernel Build Action
        uses: ./
        with:
          arch: ${{ matrix.arch }}
          tag: ${{ matrix.tag }}-${{ matrix.patch-level }}   # 实际分支名：android14-6.1-2025-03
          simple-tag: ${{ matrix.tag }}                       # 用于白名单验证：android14-6.1
          version: ${{ matrix.version }}
          fast_build: false
          module-name: ovo
          module-path: ovo

  upload-artifact:
    name: Upload LKM Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload LKM Source Code
        uses: actions/upload-artifact@v4
        with:
          name: ovo
          path: ovo
